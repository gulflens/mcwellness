<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>McWellness</title>

    <!--
      The app installs on a phone, a tablet and a desk
      (docs/SPEC/practitioner-phone.md sections 3.1 and 3.3, and
      docs/SPEC/desktop-install.md). Safari accepts no SVG here, and Windows
      wants a square raster for the taskbar and the Start menu, so the icons
      beside the manifest are PNGs rendered from public/icon.svg at the sizes
      each platform asks for.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <!--
      THESIS: A ledger, not a dashboard. Rows, rules and figures carry the practice; the
      category default of cards, hero metrics and an accent button is refused.
      OWN-WORLD: Cool mineral paper, hue-bearing ink, hairline rules, IBM Plex Sans with its
      matched Arabic, tabular figures; hue only for the five bands and three status states,
      never an accent. Practitioner ground inverts to dark.
      STORY: The coordinator sees the practice's people at a glance and finds one in seconds.
      FIRST VIEWPORT: A 220px rail on the inline start with the wordmark and sections; the
      heading, count, search and status filter, then the table from the fold up. The primary
      action is the search field.
      FORM: The ledger, pinned by docs/DESIGN-BRIEF.md section 6.2. Brief-pinned; no roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/app/shell/main.tsx"></script>
  </body>
</html>
