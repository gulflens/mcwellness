name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  verify-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        # The same image and version as production and as docker-compose.yml.
        # This database only ever holds the synthetic rows the tests create.
        image: supabase/postgres:17.6.1.155
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      API_DATABASE_URL: postgresql://mcwellness_api:mcwellness_api@localhost:5432/postgres
      IDENTITY_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm test:db
