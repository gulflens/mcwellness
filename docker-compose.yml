name: mcwellness

services:
  db:
    image: supabase/postgres:17.6.1.155
    ports:
      # Bound to the loopback interface only: the local database is never reachable from the LAN.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    environment:
      # Local development only. Staging and production credentials never appear in this repository.
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  db-data:
